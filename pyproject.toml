[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-cli"
version = "0.1.0"
description = "Terminal-native AI copilot for data analysis and data science."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shawn2110" }]
keywords = ["cli", "tui", "data-science", "data-analysis", "llm", "agent", "langgraph"]

dependencies = [
    # CLI + TUI
    "typer>=0.12.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.43",

    # Agent framework
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",

    # LLM providers (optional at runtime, imported lazily per provider)
    "langchain-ollama>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-google-genai>=2.0.0",

    # Security
    "keyring>=25.0",
    "cryptography>=42.0",

    # Data + ML
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "joblib>=1.3.0",

    # Plots + notebook export
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "nbformat>=5.10.0",
    "jinja2>=3.1.0",

    # Misc
    "pydantic>=2.6.0",
]

[project.scripts]
datapilot = "datapilot.cli:app"

[project.urls]
Homepage = "https://github.com/Shawn2110/DataPilot"

[tool.setuptools.packages.find]
include = ["datapilot*"]
